name: Grade finished games

# Secours seulement : le vrai déclencheur est le cron Supabase toutes les
# 5 min (voir supabase/cron_jobs.sql). Programmé ici toutes les 10 min,
# GitHub ne le lance en pratique que toutes les 3 à 5 heures. Les deux
# peuvent se chevaucher sans risque : grade-games ne note (et n'annonce)
# chaque pronostic qu'une fois.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Appelle /api/grade-games
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            "https://nhl-prono-drjd.vercel.app/api/grade-games" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "grade-games a répondu HTTP $status"
            exit 1
          fi
